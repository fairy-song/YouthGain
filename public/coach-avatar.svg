<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63B995"/>
      <stop offset="100%" stop-color="#1F4A38"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 圆形底 -->
  <circle cx="60" cy="60" r="56" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="56" fill="url(#glow)"/>
  <!-- 天线 -->
  <line x1="60" y1="28" x2="60" y2="38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="60" cy="26" r="3.5" fill="#ffffff" opacity="0.95"/>
  <!-- 脸部圆角矩形 -->
  <rect x="34" y="40" width="52" height="44" rx="16" fill="#ffffff" opacity="0.95"/>
  <!-- 眼睛 -->
  <circle cx="49" cy="60" r="5" fill="#1F4A38"/>
  <circle cx="71" cy="60" r="5" fill="#1F4A38"/>
  <circle cx="50.5" cy="58.5" r="1.6" fill="#ffffff"/>
  <circle cx="72.5" cy="58.5" r="1.6" fill="#ffffff"/>
  <!-- 微笑 -->
  <path d="M 52 72 Q 60 78 68 72" stroke="#1F4A38" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- 脸颊高光 -->
  <circle cx="42" cy="68" r="3" fill="#63B995" opacity="0.35"/>
  <circle cx="78" cy="68" r="3" fill="#63B995" opacity="0.35"/>
</svg>
